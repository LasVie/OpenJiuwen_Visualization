[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-visualization-local-server"
version = "0.3.0"
description = "Loopback Companion, repository adapter, and runtime trace host for OpenJiuwen Visualization"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
openjiuwen-visualization-server = "openjiuwen_visualization_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
